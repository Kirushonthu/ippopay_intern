<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact Form</title>
</head>
<style>
   *{
      text-align: center;
      font-family:Arial, Helvetica, sans-serif;
   }
   div{
      padding: 30px;
      margin: 30px;
   }
   #diiv{
      background-color: rgb(147, 233, 255);
      border-radius: 40px;
         }
   button{
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 20px;
      padding-right: 20px;
      border-radius: 50%;
      background-color: rgb(140, 29, 29);
      color: aliceblue;
      border: none;
   }
   button:hover{
      background-color: aqua;
      color: black;
   }
   input{
          box-sizing: border-box;
          width: 250px;
          padding: 10px;
          border: 2px solid black;

   }
   
</style>
<div >
<body style="background-color: rgb(71, 144, 204);">
   <h3>Registration Form</h3>
  <form style="background-color: rgb(40, 232, 168); padding-top: 50px; padding-bottom: 50px;  border-radius: 20px;"> <!--  style="background-image: url(https://images.pexels.com/photos/255379/pexels-photo-255379.jpeg);"> -->
   <div id="diiv">
    <label for="fname">First Name</label>
   <input type="text" id="fname" name="fname" placeholder="Enter First Name" required><br><br>

   <label for="lname">Last Name</label>
   <input type="text" id="lname" name="lname" placeholder="Enter Last Name" required><br> <br>

   <label for="emailnew"> Email</label>
   <input type="email" id="emailnew" name="emailnew" required><br> <br>
   
   <label for="password">Password</label>
   <input type="password" id="password" name="password" required ><br> <br>
   
   <label for="phone">phone </label>
   <input type="number" id="phone" name="phone" required> <br> <br>
   
   <button type="submit">Submit</button><br><br>

   <a href="https://www.google.com/">Get in</a>  
   </div> 
</form>
</body>
</div>
</html>
