<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margins</title>
    <style>
        *{
            text-align: center;
            margin:0;
        }
        p{
            background-color: aqua;
            padding: 50px;
            margin: 50px 80px 40px 80px;
        }
        h1{
            margin: 60px 80px;
            padding: 40px;
            background-color: aqua;   
        }

        h2{
            border: 2px solid blue;
            margin: 50px;
            padding: 60px 30px 40px; /* top right and left bottom*/
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <p>helllllo</p>
    <h1>hiee</h1>
    <h2>this is heading </h2>
</body>
</html>
