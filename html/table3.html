<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>width of tables</title>
    <style>
        h1{
            text-align: center;
        }
        th,td{
            border: 1px solid;
            padding: 20px;
        }
        table{
            text-align: center;
            width: 100%;
            border-collapse: collapse;
        }
        body{
           padding: 30px;
        }
        .fname{
            width: 40%;
        }
        .lname{
            width: 40%;
        }
        tr:hover {background-color: #D6EEEE;}
    </style>
</head>
<body>
    <h1>width tables</h1>
    <table>
         <tr>
        <th colspan="4" class="heading">Student Details</th>
        </tr>
        <tr>
            <th class="sno">Sno</th>
            <th class="fname">FirstName</th>
            <th class="lname">LastName</th>
            <th class="id">id</th>
        </tr>
        <tr style="height: 200px;">
            <td>1</td>
            <td>Kishh</td>
            <td>Swash</td>
            <td>47</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Kishh</td>
            <td>Swash</td>
            <td>47</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Kishh</td>
            <td>Swash</td>
            <td>47</td>
        </tr>
       
    </table>
</body>
</html>
