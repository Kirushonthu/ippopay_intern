<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
   
<body>

  <h1>Open Console to see the output</h1>
    <script>

        let ProductData;
        fetch("https://dummyjson.com/products")
            .then(response => response.json())
            .then(data => {
                ProductData = data.products;
                console.log("Data fetched successful")
                 console.log(ProductData)
                operations()
            })
            .catch(error => console.log("error fetcting data"))

        function operations() {
           

          function AddProduct(){
              ProductData.push({
                id: 31,
                title: "telephone",
                description: "Lorem ipsum dolor, sit amet consectetur adipisicing elit. Reiciendis, suscipit.",
                availabilityStatus: "In Stock",
                category: "groceries",
                description: "Versatile cooking oil suitable for frying, sautéing, and various culinary applications.",
                discountPercentage: 9.33  })
          } AddProduct()
          
          function Deleteproduct(id){
             const index=ProductData.findIndex((f)=>f.id===id)
             if(index===-1){
                console.log("id is invalid")
                return;
             }
            ProductData.splice(index,1)
          }
         console.log("new item added and one item deleted", Deleteproduct(1))


          function SortByPrice(){
            let sortdata=[...ProductData];
           sortdata.sort((a,b)=>a.price-b.price)
            return sortdata;
          } 
          console.log("Sorted by price",SortByPrice())

   
          function Updatestock(){
            let discount=10;
            ProductData.map((m)=>m.stock=m.stock-(discount))
            return ProductData;
          }console.log("updated product prices ",Updatestock())


          
  
          function FindProduct(idval){

          const FoundItem=  ProductData.find((f)=>f.id===idval)
            console.log( `item found in the ${idval} is`)
            return FoundItem;
          } console.log(FindProduct(7))

        }


    </script>
</body>

</html>
