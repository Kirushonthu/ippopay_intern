<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        h1{
            background-color: blanchedalmond;
            padding: 10px 20px;
            margin: 15px;
        }

        .container{

            display: flex;
            background-color: blue;
            width: 50%;
            flex-wrap: wrap;

        }
       
    </style>
</head>
<body>

    <div class="container">
         <h1>1</h1>
         <h1>2</h1>
         <h1>3</h1>
         <h1>4</h1>
         <h1>5</h1>
         <h1>6</h1>
    </div>
</body>
</html>
