    <style>
        table{
            font-family: Arial, Helvetica, sans-serif;
            width: 100%;
            border-collapse:collapse;
        }
        td,th{
           
            text-align: center;
            border-radius: 20px;
            padding: 10px;
        }
        tr:nth-child(even) {
            background-color: #c0ee35;
        }
        tr:nth-child(odd) {
            background-color: #a420f6;
        }
        *{
            margin: 0;
            padding: 0;
        }
        body{
            padding: 100px;
        }
    </style>
</head>
